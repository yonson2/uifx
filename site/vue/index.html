<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uifx: Vue</title>
    <meta name="description" content="Every uifx effect, rendered with the Vue wrappers." />
    <script>
      try {
        const theme = localStorage.getItem("uifx-theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch {}
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../">uifx</a>
      <nav class="site-nav" aria-label="Framework">
        <a href="../">HTML</a>
        <a href="../react/">React</a>
        <a href="../vue/" aria-current="page">Vue</a>
        <a href="../svelte/">Svelte</a>
      </nav>
      <div class="theme-buttons">
        <button class="button" type="button" data-theme-set="light">Light</button>
        <button class="button" type="button" data-theme-set="dark">Dark</button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="site-footer">
      <p>Docs, usage and credits are on the <a href="../">HTML page</a>.</p>
    </footer>
  </body>
</html>
